version: '3.8'

services:
  agentic_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic_ops_mcp_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
